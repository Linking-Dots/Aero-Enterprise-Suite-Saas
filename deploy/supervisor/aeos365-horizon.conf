; AEOS365 SaaS host — Horizon supervisor program
; Phase 0 Task 11 of foundation 10/10 push.
;
; Install location: /etc/supervisor/conf.d/aeos365-horizon.conf
;
; After placing this file:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start aeos365-horizon
;
; Prerequisite: laravel/horizon installed (Phase 0 Task 7 — operator-run
; `composer require laravel/horizon && php artisan horizon:install`).
;
; Adjust user= and paths to match your deployment layout.

[program:aeos365-horizon]
process_name=%(program_name)s
command=php /var/www/aeos365/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aeos365-horizon.log
stopwaitsecs=3600
