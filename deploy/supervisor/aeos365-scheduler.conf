; AEOS365 SaaS host — Laravel scheduler runner
; Phase 0 Task 11 of foundation 10/10 push.
;
; Install location: /etc/supervisor/conf.d/aeos365-scheduler.conf
;
; This replaces the traditional cron entry `* * * * * php artisan schedule:run`
; with a supervised long-running loop. Each minute it dispatches the scheduler
; in the background and sleeps. Cleaner restart semantics, single source of
; logs, no cron drift.

[program:aeos365-scheduler]
process_name=%(program_name)s
command=bash -c "while [ true ]; do (php /var/www/aeos365/artisan schedule:run --verbose --no-interaction &) ; sleep 60 ; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aeos365-scheduler.log
