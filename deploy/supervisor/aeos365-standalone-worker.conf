; AEOS365 Standalone host — fallback queue worker (when Horizon not used)
; Phase 0 Task 11 of foundation 10/10 push.
;
; Install location: /etc/supervisor/conf.d/aeos365-standalone-worker.conf
;
; Standalone deployments may not want Horizon's UI/overhead. This config
; runs 2 plain `queue:work` workers on the default + notifications queues.
;
; If you ARE running Horizon in standalone, use deploy/supervisor/aeos365-horizon.conf
; instead and remove this file.

[program:aeos365-standalone-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/aeos365-standalone/artisan queue:work redis --queue=default,notifications --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aeos365-standalone-worker.log
stopwaitsecs=3600
