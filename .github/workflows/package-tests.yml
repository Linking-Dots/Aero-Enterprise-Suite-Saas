name: Package Test Suites

# Runs the FULL package test suites (aero-core, aero-platform, aero-hrm).
# The wiring-guards workflow only runs the host Wiring regression tests;
# before this workflow existed the 149 platform+hrm test files never ran
# in CI at all (2026-07 architecture audit, finding #1).

on:
  pull_request:
    branches: [main, develop, "feature/**"]
  push:
    branches: [main, develop]

jobs:
  package-suites:
    name: aero-core + aero-platform + aero-hrm suites
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Checkout SaaS host (sibling repo, if available)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/aeos365
          path: aeos365
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, sqlite3, pdo_sqlite, redis, gd, intl, bcmath
          coverage: none

      - name: Install host dependencies
        if: hashFiles('aeos365/composer.json') != ''
        working-directory: aeos365
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run aero-core suite
        if: hashFiles('aeos365/composer.json') != ''
        working-directory: aeos365
        run: vendor/bin/phpunit -c ../monorepo/packages/aero-core/phpunit.xml

      - name: Run aero-platform suite (real MySQL)
        if: hashFiles('aeos365/composer.json') != ''
        working-directory: aeos365
        run: vendor/bin/phpunit -c ../monorepo/packages/aero-platform/phpunit.xml

      # TODO(2026-07 audit): the HRM suite rotted while unwired (auth-identity
      # relocation broke its Testbench harnesses). Harness repair is underway;
      # flip continue-on-error off once the suite is green.
      - name: Run aero-hrm suite (non-blocking until repaired)
        if: hashFiles('aeos365/composer.json') != ''
        continue-on-error: true
        working-directory: aeos365
        run: vendor/bin/phpunit -c ../monorepo/packages/aero-hrm/phpunit.xml
