<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aero-UI Theme Engine</title>
<link rel="stylesheet" href="css/app.css">
<style>
html,body{height:100%;margin:0;overflow:hidden}
.engine-root{display:flex;flex-direction:column;height:100vh}
.engine-preview{flex:1;min-height:0;position:relative;overflow:hidden}
.engine-shell-wrap{display:none;height:100%}
.engine-shell-wrap.is-active{display:block}
.engine-shell-wrap>[data-aeos-shell]{min-height:100vh}
.aeos-theme-drawer-trigger{display:flex!important}
.engine-drawer{position:fixed;inset:0;z-index:1001;display:none}
.engine-drawer.is-open{display:block}
.engine-drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.engine-drawer-panel{position:absolute;top:0;right:0;bottom:0;width:420px;background:var(--aeos-bg-elevated);border-left:1px solid var(--aeos-border);overflow-y:auto;animation:aeos-anim-slide-in-right .3s var(--aeos-ease-out)}
@media(max-width:480px){.engine-drawer-panel{width:100%}}
.engine-drawer-header{display:flex;align-items:center;justify-content:space-between;padding:1.5rem;border-bottom:1px solid var(--aeos-border);position:sticky;top:0;background:var(--aeos-bg-elevated);z-index:1}
.engine-drawer-title{font-size:1.1rem;font-weight:600;color:var(--aeos-text-primary)}
.engine-drawer-content{padding:1.5rem}
.engine-section{margin-bottom:2rem}
.engine-section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;color:var(--aeos-text-secondary);font-weight:600;margin-bottom:.75rem}
.engine-chip-group{display:flex;flex-wrap:wrap;gap:.5rem}
.engine-chip{padding:.5rem .75rem;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:var(--aeos-text-primary);font-size:.8rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.4rem}
.engine-chip:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.engine-chip.is-active{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.3);color:var(--aeos-primary)}
.engine-thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.75rem}
.engine-thumb{height:48px;border-radius:8px;border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.engine-thumb:hover{transform:scale(1.03)}
.engine-thumb.is-active{box-shadow:0 0 0 2px var(--aeos-primary)}
.engine-thumb .t-bar{position:absolute;bottom:4px;left:4px;right:4px;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
.engine-swatch-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem;margin-bottom:.75rem}
.engine-swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.engine-swatch:hover{transform:scale(1.1)}
.engine-swatch.is-active{border-color:var(--aeos-text-primary);box-shadow:0 0 0 2px var(--aeos-bg-elevated),0 0 0 4px var(--aeos-text-primary)}
.engine-range-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem}
.engine-range-wrap label{font-size:.8rem;color:var(--aeos-text-secondary);min-width:80px}
.engine-range-wrap input[type=range]{flex:1}
.engine-range-wrap .range-val{font-size:.8rem;color:var(--aeos-text-primary);min-width:40px;text-align:right;font-family:var(--aeos-font-mono)}
.engine-toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.engine-toggle-row label{font-size:.85rem;color:var(--aeos-text-primary)}
.engine-font-preview{font-size:1.25rem;padding:.75rem;background:var(--aeos-bg-card);border-radius:var(--aeos-r-md);margin-bottom:.5rem;border:1px solid var(--aeos-border);color:var(--aeos-text-primary)}
.engine-css-out{white-space:pre-wrap;font-family:var(--aeos-font-mono);font-size:.75rem;background:var(--aeos-bg-page);border:1px solid var(--aeos-border);border-radius:var(--aeos-r-md);padding:1rem;max-height:200px;overflow:auto;color:var(--aeos-text-secondary);margin-top:.75rem;display:none}
.engine-css-out.is-open{display:block}
[data-aeos-shell="sidebar"]{grid-template-columns:var(--engine-sidebar-width,56px) 1fr}
.aeos-glass,.aeos-glass-strong,[data-aeos-shell="floating"] .aeos-shell-sidebar{backdrop-filter:blur(var(--engine-glass-blur,16px));-webkit-backdrop-filter:blur(var(--engine-glass-blur,16px))}
.aeos-icon-btn{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid transparent;color:var(--aeos-text-secondary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all var(--aeos-dur-fast) var(--aeos-ease-out)}
.aeos-icon-btn:hover{background:rgba(255,255,255,.08);color:var(--aeos-text-primary)}
.engine-demo-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
.engine-demo-stat{padding:1rem}
.engine-demo-stat-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--aeos-text-tertiary);margin-bottom:.25rem}
.engine-demo-stat-value{font-family:var(--aeos-font-display);font-size:1.5rem;font-weight:700;color:var(--aeos-text-primary)}
.engine-demo-table{width:100%;border-collapse:collapse;font-size:.875rem}
.engine-demo-table th{text-align:left;padding:.6rem .75rem;color:var(--aeos-text-tertiary);font-weight:500;border-bottom:1px solid var(--aeos-divider);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.engine-demo-table td{padding:.6rem .75rem;color:var(--aeos-text-secondary);border-bottom:1px solid var(--aeos-divider)}
.engine-demo-bento-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
</style>
</head>
<body class="aeos aeos--dark">

<script>

const D=[{v:'compact',l:'Compact'},{v:'comfortable',l:'Comfortable'},{v:'spacious',l:'Spacious'}];

const B=[{v:'hairline',l:'Hairline'},{v:'standard',l:'Standard'},{v:'bold',l:'Bold'}];

const S=new Set(['oled','midnight','high-contrast']);
const RM={sharp:.4,balanced:1,soft:1.5},DM={compact:.75,comfortable:1,spacious:1.25},BW={hairline:'0.5px',standard:'1px',bold:'2px'};
const SVG=(p,w=18,h=18)=>`<svg width="${w}" height="${h}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${p}</svg>`;
const I={home:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',dollar:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',menu:'<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>'};
function ld(){try{const r=localStorage.getItem(SK);if(!r)return{...DEF};return{...DEF,...JSON.parse(r)}}catch(e){return{...DEF}}}

b.className=cls.join(' ');b.dataset.aeosShell=st.shell;b.dataset.cardStyle=st.cardStyle;b.dataset.density=st.density;b.dataset.radius=st.radius;b.dataset.borders=st.borders;b.dataset.motion=st.motion;
b.style.setProperty('--aeos-primary',st.accent);b.style.setProperty('--aeos-font-display',`'${st.fontDisplay}',system-ui,sans-serif`);b.style.setProperty('--aeos-font-body',`'${st.fontBody}',system-ui,sans-serif`);b.style.setProperty('--aeos-font-mono',`'${st.fontMono}',ui-monospace,monospace`);b.style.setProperty('--aeos-font-scale',String(st.fontScale));b.style.setProperty('--aeos-density-factor',String(DM[st.density]??1));b.style.setProperty('--aeos-card-radius',`calc(var(--aeos-r-xl)*${RM[st.radius]??1})`);b.style.setProperty('--aeos-border-w',BW[st.borders]??'1px');b.style.setProperty('--engine-sidebar-width',st.sidebarWidth+'px');b.style.setProperty('--engine-glass-blur',st.glassIntensity+'px');

const DC=`<div class="aeos-page-container"><div class="engine-demo-row"><div class="aeos-card-auto engine-demo-stat"><div class="engine-demo-stat-label">Revenue</div><div class="engine-demo-stat-value">$42.8K</div></div><div class="aeos-card-auto engine-demo-stat"><div class="engine-demo-stat-label">Users</div><div class="engine-demo-stat-value">1,240</div></div><div class="aeos-card-auto engine-demo-stat"><div class="engine-demo-stat-label">Growth</div><div class="engine-demo-stat-value" style="color:var(--aeos-success)">+12%</div></div></div><div class="aeos-cta-glass" style="margin-bottom:1.5rem"><h2 style="margin:0 0 .5rem;font-family:var(--aeos-font-display);font-size:1.25rem">Welcome back</h2><p style="margin:0 0 1rem;color:var(--aeos-text-secondary);font-size:.875rem">Your dashboard is ready for review.</p><button class="aeos-btn aeos-btn-primary aeos-btn-sm">Get Started</button></div><div class="aeos-card-auto" style="margin-bottom:1.5rem;overflow:hidden"><table class="engine-demo-table"><thead><tr><th>Employee</th><th>Role</th><th>Status</th><th>Salary</th></tr></thead><tbody><tr><td style="color:var(--aeos-text-primary);font-weight:500">Alice J.</td><td>Engineer</td><td><span style="color:var(--aeos-success)">Active</span></td><td style="font-family:var(--aeos-font-mono)">$8,500</td></tr><tr><td style="color:var(--aeos-text-primary);font-weight:500">Bob S.</td><td>Designer</td><td><span style="color:var(--aeos-success)">Active</span></td><td style="font-family:var(--aeos-font-mono)">$7,200</td></tr><tr><td style="color:var(--aeos-text-primary);font-weight:500">Carol W.</td><td>Manager</td><td><span style="color:var(--aeos-secondary)">Away</span></td><td style="font-family:var(--aeos-font-mono)">$9,100</td></tr></tbody></table></div><div class="aeos-card-auto" style="margin-bottom:1.5rem"><div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem"><div class="aeos-field"><label class="aeos-label">Email</label><input class="aeos-input" placeholder="user@example.com"/></div><div class="aeos-field"><label class="aeos-label">Department</label><select class="aeos-input"><option>Engineering</option><option>Design</option><option>HR</option></select></div></div><div style="display:flex;gap:.75rem;margin-top:1rem"><button class="aeos-btn aeos-btn-primary aeos-btn-sm">Save</button><button class="aeos-btn aeos-btn-ghost aeos-btn-sm">Cancel</button></div></div><div class="engine-demo-bento-grid"><div class="aeos-bento"><div style="font-family:var(--aeos-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--aeos-text-tertiary);margin-bottom:.5rem">Uptime</div><div style="font-size:1.5rem;font-weight:700;color:var(--aeos-text-primary)">99.99%</div></div><div class="aeos-bento"><div style="font-family:var(--aeos-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--aeos-text-tertiary);margin-bottom:.5rem">Requests</div><div style="font-size:1.5rem;font-weight:700;color:var(--aeos-text-primary)">2.4M</div></div><div class="aeos-bento"><div style="font-family:var(--aeos-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--aeos-text-tertiary);margin-bottom:.5rem">Latency</div><div style="font-size:1.5rem;font-weight:700;color:var(--aeos-text-primary)">24ms</div></div><div class="aeos-bento"><div style="font-family:var(--aeos-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--aeos-text-tertiary);margin-bottom:.5rem">Errors</div><div style="font-size:1.5rem;font-weight:700;color:var(--aeos-destructive)">0.02%</div></div></div></div>`;
const NAV=(sh,items)=>{

};

const shellsHTML=SHELLS.map(s=>{const n=NAV(s.v,items),t=TB(s.v),cmd=s.v==='command';return '<div class="engine-shell-wrap '+(s.v===st.shell?'is-active':'')+'" data-shell="'+s.v+'"><div data-aeos-shell="'+s.v+'">'+n+(cmd?t+DC+'</main></div><aside class="aeos-shell-right" aria-label="Context"><div class="aeos-shell-widget"><div class="aeos-shell-widget-title">Properties</div><div class="aeos-field"><label class="aeos-label">Name</label><input class="aeos-input" value="Project Alpha"/></div></div></aside></div>':t+DC+(s.v==='topnav'?'</main>':'</main></div>')+'</div></div>');}).join('');
document.getElementById('root').insertAdjacentHTML('beforeend',`<div class="engine-preview" id="previewStage">${shellsHTML}</div><button type="button" class="aeos-theme-drawer-trigger" id="triggerBtn" aria-label="Open Theme Studio">${SVG(I.star,18,18)}</button>`);
const modeThumbs=MODES.map(m=>'<div class="engine-thumb '+((st.mode===m.v&&st.variant==='default')||(st.mode+'-'+st.variant)===m.v?'is-active':'')+'" data-mode="'+m.v.split('-')[0]+'" data-variant="'+(m.v.includes('-')?m.v.split('-').slice(1).join('-'):'default')+'" style="background:'+m.bg+'" title="'+m.l+'"><div style="position:absolute;top:4px;left:4px;right:4px;bottom:4px;background:'+m.c+';border-radius:4px"></div><div class="t-bar"></div></div>').join('');
const shellThumbs=SHELLS.map(s=>{let i='';if(s.v==='sidebar')i='<div style="position:absolute;top:0;left:0;bottom:0;width:22%;background:rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.1)"></div>';if(s.v==='topnav')i='<div style="position:absolute;top:0;left:0;right:0;height:20%;background:rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.1)"></div>';if(s.v==='floating')i='<div style="position:absolute;top:4px;left:4px;bottom:4px;width:18%;background:rgba(255,255,255,.08);border-radius:6px;border:1px solid rgba(255,255,255,.1)"></div>';if(s.v==='command')i='<div style="position:absolute;top:0;left:0;bottom:0;width:22%;background:rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.1)"></div><div style="position:absolute;top:0;right:0;bottom:0;width:26%;background:rgba(255,255,255,.06);border-left:1px solid rgba(255,255,255,.1)"></div>';return '<div class="engine-thumb '+(s.v===st.shell?'is-active':'')+'" data-sec="shell" data-value="'+s.v+'" style="background:var(--aeos-bg-card);position:relative;overflow:hidden;border-radius:8px;border:1px solid rgba(255,255,255,.08);height:48px;cursor:pointer;transition:transform .15s" onmouseenter="this.style.transform=\'scale(1.03)\'" onmouseleave="this.style.transform=\'\'">'+i+'</div>';}).join('');
const cardThumbs=CARDS.map(c=>'<div class="engine-thumb '+(c.v===st.cardStyle?'is-active':'')+'" data-sec="cardStyle" data-value="'+c.v+'" style="background:var(--aeos-bg-card);position:relative;overflow:hidden;border-radius:8px;border:1px solid rgba(255,255,255,.08);height:48px;cursor:pointer;transition:transform .15s;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--aeos-text-secondary)" onmouseenter="this.style.transform=\'scale(1.03)\'" onmouseleave="this.style.transform=\'\'"><span class="aeos-card-auto" style="padding:4px 8px;font-size:.65rem;border-radius:4px">'+c.l+'</span></div>').join('');
const chips=(arr,sec)=>arr.map(x=>'<button type="button" class="engine-chip '+(x.v===st[sec]?'is-active':'')+'" data-sec="'+sec+'" data-value="'+x.v+'">'+x.l+'</button>').join('');
const swatches=A.map(a=>'<button type="button" class="engine-swatch '+(a.v===st.accent?'is-active':'')+'" data-sec="accent" data-value="'+a.v+'" style="background:'+a.v+'" title="'+a.l+'"></button>').join('');
const fontOpts=F.map(f=>'<option value="'+f.v+'" '+(f.v===st.fontDisplay?'selected':'')+'>'+f.l+'</option>').join('');
const drawerHTML='<div class="engine-drawer" id="engineDrawer"><div class="engine-drawer-backdrop" id="drawerBackdrop"></div><aside class="engine-drawer-panel" id="drawerPanel"><header class="engine-drawer-header"><span class="engine-drawer-title">Theme Studio</span><button type="button" class="aeos-icon-btn" id="drawerClose" aria-label="Close">'+SVG(I.x,16,16)+'</button></header><div class="engine-drawer-content">'+
'<div class="engine-section"><div class="engine-section-title">Color Mode</div><div class="engine-thumb-grid">'+modeThumbs+'</div></div>'+
'<div class="engine-section"><div class="engine-section-title">Layout Shell</div><div class="engine-thumb-grid">'+shellThumbs+'</div></div>'+
'<div class="engine-section"><div class="engine-section-title">Card Style</div><div class="engine-thumb-grid">'+cardThumbs+'</div></div>'+
'<div class="engine-section"><div class="engine-section-title">Dimensions</div><div id="morphCard" class="engine-morph-card"><div style="font-size:.8rem;color:var(--aeos-text-secondary)">Preview card</div></div><div class="engine-chip-group">'+chips(D,'density')+chips(R,'radius')+chips(B,'borders')+'</div></div>'+
'<div class="engine-section"><div class="engine-section-title">Accent</div><div class="engine-swatch-grid">'+swatches+'</div><div style="display:flex;align-items:center;gap:.5rem;margin-top:.5rem"><input type="color" id="accentPicker" value="'+st.accent+'" style="width:32px;height:32px;border:none;padding:0;background:none;cursor:pointer"/><span style="font-size:.8rem;color:var(--aeos-text-secondary);font-family:var(--aeos-font-mono)">'+st.accent+'</span></div></div>'+
'<div class="engine-section"><div class="engine-section-title">Typography</div><select id="fontSelect" class="aeos-input" style="margin-bottom:.5rem">'+fontOpts+'</select><div class="engine-range-wrap"><label>Scale</label><input type="range" id="fontScale" min="0.75" max="1.5" step="0.05" value="'+st.fontScale+'"><span class="range-val" id="fontScaleVal">'+st.fontScale+'</span></div><div id="fontPreview" class="engine-font-preview">The quick brown fox</div></div>'+
'<div class="engine-section"><div class="engine-section-title">Motion</div><div class="engine-chip-group">'+chips(M,'motion')+'</div></div>'+
'<div class="engine-section"><div class="engine-section-title">Performance</div><div class="engine-toggle-row"><label>No Blur</label><input type="checkbox" id="noBlur" '+(st.noBlur?'checked':'')+'></div><div class="engine-toggle-row"><label>No Glow</label><input type="checkbox" id="noGlow" '+(st.noGlow?'checked':'')+'></div><div class="engine-toggle-row"><label>No Gradient Text</label><input type="checkbox" id="noGradientText" '+(st.noGradientText?'checked':'')+'></div><div class="engine-toggle-row"><label>No Grid Texture</label><input type="checkbox" id="noGridTexture" '+(st.noGridTexture?'checked':'')+'></div></div>'+
'<div class="engine-section"><div class="engine-section-title">Layout Overrides</div><div class="engine-range-wrap"><label>Sidebar</label><input type="range" id="sidebarWidth" min="48" max="280" step="4" value="'+st.sidebarWidth+'"><span class="range-val" id="sidebarWidthVal">'+st.sidebarWidth+'px</span></div><div class="engine-range-wrap"><label>Glass Blur</label><input type="range" id="glassIntensity" min="0" max="40" step="1" value="'+st.glassIntensity+'"><span class="range-val" id="glassIntensityVal">'+st.glassIntensity+'px</span></div></div>'+
'<div class="engine-section"><div class="engine-section-title">Actions</div><div class="engine-chip-group"><button type="button" class="engine-chip" id="resetBtn">Reset</button><button type="button" class="engine-chip" id="copyBtn">Copy CSS</button></div><textarea id="cssOutput" class="engine-css-out" readonly></textarea></div>'+
'</div></aside></div>';
document.getElementById('root').insertAdjacentHTML('beforeend',drawerHTML);
function copyCSS(){
const cls=bcls(st.mode,st.variant);
if(st.noBlur)cls.push('aeos--no-blur');if(st.noGlow)cls.push('aeos--no-glow');if(st.noGradientText)cls.push('aeos--no-gradient-text');if(st.noGridTexture)cls.push('aeos--no-grid-texture');
const lines=['/* Aero-UI Theme Overrides */','body {','  --aeos-primary: '+st.accent+';','  --aeos-font-display: \''+st.fontDisplay+'\', system-ui, sans-serif;','  --aeos-font-body: \''+st.fontBody+'\', system-ui, sans-serif;','  --aeos-font-mono: \''+st.fontMono+'\', ui-monospace, monospace;','  --aeos-font-scale: '+st.fontScale+';','  --aeos-density-factor: '+(DM[st.density]??1)+';','  --aeos-card-radius: calc(var(--aeos-r-xl) * '+(RM[st.radius]??1)+');','  --aeos-border-w: '+(BW[st.borders]??'1px')+';','}','body.className = \''+cls.join(' ')+'\';','body.dataset.aeosShell = \''+st.shell+'\';','body.dataset.cardStyle = \''+st.cardStyle+'\';','body.dataset.density = \''+st.density+'\';','body.dataset.radius = \''+st.radius+'\';','body.dataset.borders = \''+st.borders+'\';','body.dataset.motion = \''+st.motion+'\';'];
const out=document.getElementById('cssOutput');out.value=lines.join('\n');out.classList.add('is-open');out.select();}
function init(){
ap();
document.getElementById('triggerBtn').addEventListener('click',()=>document.getElementById('engineDrawer').classList.add('is-open'));
document.getElementById('drawerBackdrop').addEventListener('click',()=>document.getElementById('engineDrawer').classList.remove('is-open'));
document.getElementById('drawerClose').addEventListener('click',()=>document.getElementById('engineDrawer').classList.remove('is-open'));
document.getElementById('previewStage').addEventListener('click',e=>{if(e.target.closest('#sbToggle')){const sb=document.querySelector('[data-aeos-shell="sidebar"] aside');if(sb)sb.classList.toggle('is-expanded')}});
document.getElementById('root').addEventListener('click',e=>{
const chip=e.target.closest('.engine-chip[data-sec]');if(chip){const sec=chip.dataset.sec;up({[sec]:chip.dataset.value});return;}
const thumb=e.target.closest('.engine-thumb[data-sec]');if(thumb){const sec=thumb.dataset.sec;up({[sec]:thumb.dataset.value});return;}
const mode=e.target.closest('[data-mode]');if(mode){const v=mode.dataset.mode,va=mode.dataset.variant||'default';up({mode:v,variant:va});return;}
const sw=e.target.closest('.engine-swatch[data-sec="accent"]');if(sw){up({accent:sw.dataset.value});return;}
if(e.target.closest('#resetBtn')){rs();return;}
if(e.target.closest('#copyBtn')){copyCSS();return;}
});
['fontScale','sidebarWidth','glassIntensity'].forEach(id=>{
const el=document.getElementById(id);if(!el)return;
let raf=null;
el.addEventListener('input',()=>{
const v=parseFloat(el.value);
document.getElementById(id+'Val').textContent=id==='fontScale'?v:(v+'px');
if(raf)cancelAnimationFrame(raf);
raf=requestAnimationFrame(()=>up({[id]:v}));
});
});
document.getElementById('fontSelect').addEventListener('change',e=>{
const v=e.target.value,f=F.find(x=>x.v===v);up({fontDisplay:f?f.d:v,fontBody:f?f.b:v,fontMono:f?f.m:'JetBrains Mono'});
});
document.getElementById('accentPicker').addEventListener('input',e=>up({accent:e.target.value}));
['noBlur','noGlow','noGradientText','noGridTexture'].forEach(id=>{
const el=document.getElementById(id);if(!el)return;
el.addEventListener('change',()=>up({[id]:el.checked}));
});
}
init();
</script>
</body>
</html>
